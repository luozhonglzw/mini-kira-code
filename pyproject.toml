[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kiracode"
version = "0.1.0"
description = "Hierarchical Planning AI Coding Agent System"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "rich>=13.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "networkx>=3.0",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.5.0",
    "httpx>=0.25.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]
rag = [
    "chromadb>=0.4.0",
    "tree-sitter>=0.20.0",
]
vision = [
    "ultralytics>=8.0.0",
]
all = [
    "kiracode[dev,rag]",
]

[project.scripts]
kiracode = "kiracode.main:main"
kiracode-chat = "kiracode.cli.chat:main"

[tool.setuptools.packages.find]
include = ["kiracode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
